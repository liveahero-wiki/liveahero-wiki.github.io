<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live A Hero 2026 Community Survey</title>
<style>
    html, body {
        margin: 0;
    }
    iframe {
        height: 100vh;
        width: 100%;
        border: 0;
    }
</style>
</head>
<script>
    window.addEventListener("message", (event) => {
        if (event.source !== document.getElementById("survey").contentWindow) return;
        if (event.data.type === "resize") {
            document.getElementById("survey").style.height = event.data.height + "px";
        }
    });
</script>
<body>
<article class="markdown-body">
    <hgroup>
        <h1>Live A Hero 2026 Community Survey (ended)</h1>
    </hgroup>

    <p>The survey has ended. The result will be published by the end of October in <a href="/blog/">Wiki blog</a>.</p>

    <p>问卷调查已结束。结果将于10月底前发布在<a href="/blog/">wiki部落格</a>上。</p>

    <p>アンケート調査は終了しました。結果は10月末までに<a href="/blog/">Wikiブログ</a>に掲載されます。
</p>

</article>
<script async src="https://liveahero-wiki-stats.rongjie.workers.dev/report.js"></script>
</body>
</html>
