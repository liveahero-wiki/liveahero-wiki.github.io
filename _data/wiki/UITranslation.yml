UI_SUPPORT_SKILL_TAG_SKILL1_SUBJECT: "Skill 1"
UI_SUPPORT_SKILL_TAG_SKILL1_BODY: "Tag for support skills that trigger an additional effect when Skill 1 is used, or that buff allies in connection with Skill 1.\nCollecting 3 causes allies to activate Skill 1 again when they use it (once per turn)."
UI_SUPPORT_SKILL_TAG_ROOKIE_SUBJECT: "Rookie"
UI_SUPPORT_SKILL_TAG_ROOKIE_BODY: "Tag for support skills that greatly strengthen heroes with an initial rank of 3 or below.\nCollecting 3 grants allies with an initial rank below 3 a bonus based on role:\nAttack: ATK +50%\nDefense: Restore 20% max HP at end of turn\nRecovery: Own healing skills heal x1.5\nView Gain: View gain +50%\nSupport: Buffs granted last +1 turn\nDebuff: Debuffs granted last +1 turn\nSPD Control: At end of turn, inflict +20% damage taken for 1 turn on enemies who haven't acted\nSpecial: View cost -50%"
UI_SUPPORT_SKILL_TAG_HAISUI_SUBJECT: "Desperation"
UI_SUPPORT_SKILL_TAG_HAISUI_BODY: "Tag for support skills that strengthen allies as their HP drops, or that strengthen allies by dealing damage to them.\nCollecting 3 lets an ally survive one otherwise-fatal blow with 1% max HP remaining."
